                if (e.target !== col) return;
                col.classList.remove('dragging');
                col.removeAttribute('draggable');
                draggedCol = null;
                saveAppData();
            });

                if (!isEditing || !draggedCol || draggedCol === col) return;
                e.preventDefault();

                board.insertBefore(draggedCol, getColAfter(board, e.clientX, e.clientY) || board.querySelector('.add-col-btn'));

                /* Move aba para esquerda (-1) ou direita (+1) sem depender de arrastar */
        function moveTab(tabId, direction) {
            const data = getAppData();
            const order = getSavedTabOrder(data);
            const idx = order.indexOf(tabId);
            if (idx < 0) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= order.length) return;

            order.splice(idx, 1);
            order.splice(newIdx, 0, tabId);
            saveTabOrder(order);

            const reordered = {};
            order.forEach(k => { if (data[k]) reordered[k] = data[k]; });
            Object.keys(data).forEach(k => { if (!reordered[k]) reordered[k] = data[k]; });

            setAppData(reordered);
            markLocalChange();
            loadAppData();
            syncToCloudDebounced();
        }

        /* Navegação acessível entre abas via teclado (Setas, Home, End) */
        function handleTabKeyNav(e, tabId) {
            const tabs = Array.from(document.querySelectorAll('#tabsBar .tab'));
            const currentIdx = tabs.findIndex(t => t.getAttribute('data-tabid') === tabId);
            if (currentIdx < 0) return;

            let nextIdx = -1;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                nextIdx = (currentIdx + 1) % tabs.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                nextIdx = (currentIdx - 1 + tabs.length) % tabs.length;
            } else if (e.key === 'Home') {
                e.preventDefault();
                nextIdx = 0;
            } else if (e.key === 'End') {
                e.preventDefault();
                nextIdx = tabs.length - 1;
            }

            if (nextIdx >= 0) {
                const targetTab = tabs[nextIdx];
                const targetId = targetTab.getAttribute('data-tabid');
                switchTab(targetId);
                targetTab.focus();
            }
        }

        function reorderTabs(sourceId, targetId) {
            const data = getAppData();
            const currentOrder = getSavedTabOrder(data);
            const sourceIndex = currentOrder.indexOf(sourceId);
            const targetIndex = currentOrder.indexOf(targetId);

            if (sourceIndex > -1 && targetIndex > -1) {
                currentOrder.splice(sourceIndex, 1);
                currentOrder.splice(targetIndex, 0, sourceId);

                saveTabOrder(currentOrder);

                const reorderedData = {};
                currentOrder.forEach(k => {
                    if (data[k]) reorderedData[k] = data[k];
                });
                Object.keys(data).forEach(k => {
                    if (!reorderedData[k]) reorderedData[k] = data[k];
                });

                setAppData(reorderedData);
                markLocalChange();
                loadAppData();
                syncToCloudDebounced();
            }
        }

        /* Modal interno seguro que não fecha ao dar Alt+Tab */
        function maskPhone(val) {
            const digits = (val || '').replace(/\D/g, '').slice(0, 11);
            if (!digits) return '';
            if (digits.length <= 2) return `(${digits}`;
            if (digits.length <= 6) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
            if (digits.length <= 10) return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
            return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
        }

        function maskCpf(val) {
            const digits = (val || '').replace(/\D/g, '').slice(0, 11);
            if (digits.length <= 3) return digits;
            if (digits.length <= 6) return `${digits.slice(0, 3)}.${digits.slice(3)}`;
            if (digits.length <= 9) return `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6)}`;
            return `${digits.slice(0, 3)}.${digits.slice(3, 6)}.${digits.slice(6, 9)}-${digits.slice(9)}`;
        }

        function maskCnpj(val) {
            const digits = (val || '').replace(/\D/g, '').slice(0, 14);
            if (digits.length <= 2) return digits;
            if (digits.length <= 5) return `${digits.slice(0, 2)}.${digits.slice(2)}`;
            if (digits.length <= 8) return `${digits.slice(0, 2)}.${digits.slice(2, 5)}.${digits.slice(5)}`;
            if (digits.length <= 12) return `${digits.slice(0, 2)}.${digits.slice(2, 5)}.${digits.slice(5, 8)}/${digits.slice(8)}`;
            return `${digits.slice(0, 2)}.${digits.slice(2, 5)}.${digits.slice(5, 8)}/${digits.slice(8, 12)}-${digits.slice(12)}`;
        }

        function formatVariableValue(varName, value) {
            if (!value) return '';
            const vLower = (varName || '').toLowerCase();
            const cleanDigits = value.replace(/\D/g, '');
            if (['telefone', 'celular', 'fone', 'contato', 'tel'].some(k => vLower.includes(k))) {
                if (cleanDigits.length === 10 || cleanDigits.length === 11) {
                    return maskPhone(cleanDigits);
                }
            } else if (vLower.includes('cpf') && cleanDigits.length === 11) {
                return maskCpf(cleanDigits);
            } else if (vLower.includes('cnpj') && cleanDigits.length === 14) {
                return maskCnpj(cleanDigits);
            }
            return value;
        }

        function promptModal(variableName, defaultValue = '', targetDoc = document) {
            return new Promise((resolve) => {
                targetDoc = targetDoc || document;
                const overlay = targetDoc.createElement('div');
                overlay.className = 'var-modal-overlay';
                overlay.setAttribute('data-transient', 'true');

                const box = targetDoc.createElement('div');
                box.className = 'var-modal-box';

                const title = targetDoc.createElement('div');
                title.className = 'var-modal-title';
                title.textContent = `Preencher variável: (${variableName})`;

                const desc = targetDoc.createElement('div');
                desc.className = 'var-modal-desc';
                desc.textContent = 'Você pode gerenciar os valores padrão no botão "⚙️ Variáveis" no topo.';

                const input = targetDoc.createElement('input');
                input.className = 'var-modal-input';
                input.type = 'text';
                input.value = defaultValue;
                input.placeholder = `Digite o valor para (${variableName})...`;

                const vLower = variableName.toLowerCase();
                const isPhone = ['telefone', 'celular', 'fone', 'contato', 'tel'].some(k => vLower.includes(k));
                const isCpf = vLower.includes('cpf');
                const isCnpj = vLower.includes('cnpj');

                if (isPhone) {
                    input.placeholder = '(XX) XXXXX-XXXX';
                    if (defaultValue) input.value = maskPhone(defaultValue);
                    input.addEventListener('input', () => { input.value = maskPhone(input.value); });
                } else if (isCpf) {
                    input.placeholder = '000.000.000-00';
                    if (defaultValue) input.value = maskCpf(defaultValue);
                    input.addEventListener('input', () => { input.value = maskCpf(input.value); });
                } else if (isCnpj) {
                    input.placeholder = '00.000.000/0000-00';
                    if (defaultValue) input.value = maskCnpj(defaultValue);
                    input.addEventListener('input', () => { input.value = maskCnpj(input.value); });
                }

                const btns = targetDoc.createElement('div');
                btns.className = 'var-modal-btns';

                const btnCancel = targetDoc.createElement('button');
                btnCancel.className = 'var-modal-btn var-modal-btn-cancel';
                btnCancel.textContent = 'Cancelar';

                const btnConfirm = targetDoc.createElement('button');
                btnConfirm.className = 'var-modal-btn var-modal-btn-confirm';
                btnConfirm.textContent = 'Confirmar';

                btns.append(btnCancel, btnConfirm);
                box.append(title, desc, input, btns);
                overlay.appendChild(box);
                (targetDoc.body || targetDoc.documentElement).appendChild(overlay);

                input.focus();
                input.select();

                const close = (val) => {
                    overlay.remove();
                    resolve(val);
                };

                btnConfirm.onclick = () => close(input.value);
                btnCancel.onclick = () => close(null);
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') close(input.value);
                    if (e.key === 'Escape') close(null);
                };
            });
        }

        /* Modal de Gestão de Variáveis Padrão com modo Automático / Pop-up (⚙️ Variáveis) */

            const rows = document.createElement('div');

        /* Variáveis calculadas automaticamente */
        function fmtDate(d) {
            return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
        }
        function fmtTime(d) {
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        function addBusinessDays(d, n) {
            const r = new Date(d);
            while (n > 0) {
                r.setDate(r.getDate() + 1);
                if (r.getDay() !== 0 && r.getDay() !== 6) n--;
            }
            return r;
        }
        function applyAutoVars(text, defaults, now = new Date()) {
            const h = now.getHours();
            const saudacao = h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite');
            text = text.replace(/\(prezado\)/gi, 'Prezado(a)');
            const getVal = (k) => {
                const item = defaults[k];
                if (!item) return null;
                return typeof item === 'object' ? item.val : item;
            };
            return text
                .replace(/\(saudacao\)|\{saudacao\}/gi, saudacao)
                .replace(/\(\s*data\s*(?:\+\s*(\d{1,3}))?\s*\)/gi, (m, n) => {
                    const c = getVal('data'); if (c && n === undefined) return c;
                    const d = new Date(now); d.setDate(d.getDate() + (parseInt(n) || 0));
                    return fmtDate(d);
                })
                .replace(/\(\s*hora\s*(?:\+\s*(\d{1,2}))?\s*\)/gi, (m, n) => {
                    const c = getVal('hora'); if (c && n === undefined) return c;
                    return fmtTime(new Date(now.getTime() + (parseInt(n) || 0) * 3600000));
                })
                .replace(/\(\s*prazo\s*(?:\+\s*(\d{1,2}))?\s*\)/gi, (m, n) => {
                    const c = getVal('prazo'); if (c && n === undefined) return c;
                    return fmtDate(addBusinessDays(now, n === undefined ? 3 : parseInt(n)));
                });
        }

        const AUTO_VARS = ['saudacao', 'data', 'prazo', 'hora', 'sr_sra', 'prezado'];
        const SEED_VARS = ['nome', 'telefone', 'protocolo', 'plano', 'horas', 'link', 'data_desligamento', 'atendente', 'empresa', 'cidade', 'setor', 'usuario', 'senha'];
        const HIDDEN_VARS = ['usuario_looke', 'senha_looke'];

        function isKnownVar(v) {
            const n = v.slice(1, -1).trim().toLowerCase();
            return AUTO_VARS.includes(n) || Object.keys(getCustomDefaults()).some(k => k.toLowerCase() === n);
        }

        async function resolveVariables(text, targetDoc = document) {
            targetDoc = targetDoc || document;
            text = applyAutoVars(text, getCustomDefaults());

            const defaults = getCustomDefaults();

            const vars = [...new Set(text.match(/\([a-zA-Z0-9_\s-]{1,30}\)/g) || [])];
            for (const v of vars.filter(isKnownVar)) {
                const varName = v.slice(1, -1).trim();
                const keyLower = varName.toLowerCase();
                
                const entry = defaults[varName] || defaults[keyLower];
                let val = '';
                let mode = 'popup';

                if (entry) {
                    if (typeof entry === 'object') {
                        val = entry.val || '';
                        mode = entry.mode || 'popup';
                    } else {
                        val = entry;
                        mode = 'auto';
                    }
                }

                if (mode === 'popup' || !val) {
                    val = await promptModal(varName, val, targetDoc);
                    if (val === null) return null;
                }
                val = formatVariableValue(varName, val);
                text = text.split(v).join(val);
            }

            return text;
        }

        function insertCommand(cmd) {
            if (!isEditing) {
                alert("Ative o 'Modo Edição' para inserir comandos diretamente nos campos de texto.");
                return;
            }
            const activeTabContent = document.getElementById(currentActiveTabId);
            if (!activeTabContent) return;
            const textareas = activeTabContent.querySelectorAll('.item-textarea');
            
            let targetTa = Array.from(textareas).find(ta => document.activeElement === ta);
            if (!targetTa && textareas.length > 0) {
                targetTa = textareas[0];
            }

            if (targetTa) {
                const start = targetTa.selectionStart;
                const end = targetTa.selectionEnd;
                const val = targetTa.value;
                targetTa.value = val.substring(0, start) + cmd + val.substring(end);
                targetTa.selectionStart = targetTa.selectionEnd = start + cmd.length;
                targetTa.focus();
                
                const card = targetTa.closest('.item-card');
                if (card) {
                    const pre = card.querySelector('.item-text');
                    if (pre) pre.innerText = targetTa.value;
                }
                saveAppData();
            }
        }

        async function copyTextToClipboard(text, doc) {
            const targetDoc = doc || document;
            const targetWin = targetDoc.defaultView || window;
            try {
                if (targetWin.navigator && targetWin.navigator.clipboard && targetWin.isSecureContext) {
                    await targetWin.navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}

            try {
                const ta = targetDoc.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                ta.style.opacity = '0';
                targetDoc.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, ta.value.length);
                const ok = targetDoc.execCommand('copy');
                targetDoc.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        async function copyCardText(button) {
            if (button.dataset.isCopying === 'true') return; // Prevenção contra cliques duplos rápidos
            button.dataset.isCopying = 'true';

            const card = button.closest('.item-card');
            const textarea = card.querySelector('.item-textarea');
            const msg = card.querySelector('.copied-msg');

            let text = textarea.value;
            let resolved = await resolveVariables(text);
            if (resolved !== null) resolved = cleanExcessiveNewlines(resolved);
            if (resolved === null) {
                button.dataset.isCopying = 'false';
                return;
            }

            // Incremento e persistência imediata no card e no localStorage
            const newCount = (parseInt(card.dataset.copyCount) || 0) + 1;
            card.dataset.copyCount = newCount;
            const badge = button.querySelector('.copy-count-badge');
            if (badge) badge.textContent = ` (${newCount}x)`;
            saveAppDataDebounced();

            recordScriptUsage();
            addRecentCopy(resolved);

            copyTextToClipboard(resolved).then(ok => {
                if (msg) {
                    msg.setAttribute('aria-live', 'polite');
                    msg.textContent = ok ? 'Copiado!' : 'Falha ao copiar';
                    msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; }, 1500);
                }
                if (typeof showToast === 'function' && ok) {
                    showToast('📋 Script copiado para a área de transferência!', 'success');
                }
            }).catch(err => {
                alert('Não foi possível copiar: permissão de área de transferência negada pelo navegador.');
            }).finally(() => {
                setTimeout(() => { button.dataset.isCopying = 'false'; }, 400);
            });
        }

        let activeModalTriggerEl = null;

        const modalFocusStack = [];

        function createAccessibleModal({ id, title, contentHtml, footerHtml, width = 'min(560px, 94vw)', onConfirm, confirmText = 'Confirmar', triggerElement = null }) {
            const trigger = triggerElement || document.activeElement;
            modalFocusStack.push(trigger);
            document.body.classList.add('modal-open');

            const overlay = document.createElement('div');
            overlay.className = 'var-modal-overlay';
            overlay.setAttribute('data-transient', 'true');
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            if (id) overlay.id = id;

            const titleId = (id || 'modal') + '-title';
            overlay.setAttribute('aria-labelledby', titleId);

            overlay.innerHTML = `
                <div class="var-modal-box vm-box" style="width: ${width}; max-height: 90vh;">
                    <div class="vm-head">
                        <div class="vm-title" id="${titleId}">${title}</div>
                        <button class="vm-x" aria-label="Fechar janela modal">✕</button>
                    </div>
                    <div class="vm-body" style="padding: 18px 20px; gap: 14px; overflow-y: auto;">
                        ${contentHtml}
                    </div>
                    <div class="vm-foot" style="padding: 12px 20px; justify-content: space-between;">
                        ${footerHtml || `
                            <button class="var-modal-btn var-modal-btn-cancel">Fechar</button>
                            ${onConfirm ? `<button class="var-modal-btn var-modal-btn-confirm" id="btnUniversalConfirm">${confirmText}</button>` : ''}
                        `}
                    </div>
                </div>
            `;

            function closeModal() {
                document.removeEventListener('keydown', handleKeyDown);
                overlay.remove();
                const previousTrigger = modalFocusStack.pop();
                if (document.querySelectorAll('.var-modal-overlay, .update-overlay, .usm-overlay').length === 0) {
                    document.body.classList.remove('modal-open');
                }
                if (previousTrigger && typeof previousTrigger.focus === 'function') {
                    try { previousTrigger.focus(); } catch (e) {}
                }
            }

            overlay.querySelector('.vm-x').onclick = closeModal;
            const cancelBtn = overlay.querySelector('.var-modal-btn-cancel');
            if (cancelBtn) cancelBtn.onclick = closeModal;

            // Fechamento ao clicar fora do conteúdo
            overlay.addEventListener('mousedown', (e) => {
                if (e.target === overlay) closeModal();
            });

            if (onConfirm) {
                const confBtn = overlay.querySelector('#btnUniversalConfirm');
                if (confBtn) confBtn.onclick = () => onConfirm(closeModal, overlay);
            }

            // Focus Trap rigoroso e tecla Escape para acessibilidade WCAG/WAI-ARIA
            function handleKeyDown(e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    closeModal();
                    return;
                }
                if (e.key === 'Tab') {
                    const focusables = Array.from(overlay.querySelectorAll(
                        'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
                    )).filter(el => el.offsetWidth > 0 || el.offsetHeight > 0);

                    if (focusables.length === 0) {
                        e.preventDefault();
                        return;
                    }
                    const firstEl = focusables[0];
                    const lastEl = focusables[focusables.length - 1];

                    if (e.shiftKey) {
                        if (document.activeElement === firstEl || !overlay.contains(document.activeElement)) {
                            e.preventDefault();
                            lastEl.focus();
                        }
                    } else {
                        if (document.activeElement === lastEl || !overlay.contains(document.activeElement)) {
                            e.preventDefault();
                            firstEl.focus();
                        }
                    }
                }
            }

            document.addEventListener('keydown', handleKeyDown);
            document.body.appendChild(overlay);

            // Foco inicial automático
            setTimeout(() => {
                const firstFocusable = overlay.querySelector('input:not([disabled]), textarea:not([disabled]), select:not([disabled]), button:not(.vm-x)');
                if (firstFocusable) firstFocusable.focus();
            }, 40);

            return { overlay, closeModal };
        }

            function updatePreview() {

                    ? [currentActiveTabId] 
                    : Object.keys(data);

                targetTabIds.forEach(tId => {
                    const tab = data[tId];
                    if (!tab || !Array.isArray(tab.groups)) return;
                    tab.groups.forEach(g => {
                        if (!Array.isArray(g.items)) return;
                        g.items.forEach(item => {
                            let txt = typeof item === 'string' ? item : (item.text || '');
                            if (matchCase) {
                                if (txt.includes(term)) {
                                    const parts = txt.split(term);
                                    count += parts.length - 1;
                                    txt = parts.join(replacement);
                                }
                            } else {
                                const regex = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                                const m = txt.match(regex);
                                if (m) {
                                    count += m.length;
                                    txt = txt.replace(regex, replacement);
                                }
                            }
                            if (typeof item === 'string') {
                                item = txt;
                            } else {
                                item.text = txt;
                            }
                        });
                    });
                });

                setAppData(data);
                markLocalChange();
                loadAppData();
                syncToCloudDebounced();
                overlay.remove();

                if (typeof showToast === 'function') {
                    showToast(`⚡ Substituídas ${count} ocorrência(s) com sucesso!`, 'success');
                } else {
                    alert(`⚡ Substituídas ${count} ocorrência(s) com sucesso!`);
                }
            };

            document.body.appendChild(overlay);
            setTimeout(() => findIn.focus(), 50);
        }

        /* Importa backup detectando automaticamente se é Completo (v2.5.3) ou Legado (somente scripts) */
                /* Validador Rigoroso e Imutável de Arquivos Importados (JSON v2.6.4) */
                function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function sanitizeFullBackup(parsed) {
            const allowedThemes = ['dark', 'oled', 'light'];
            const allowedLayouts = ['grid', 'list'];
            const scripts = (parsed && typeof parsed.scripts === 'object') ? parsed.scripts : {};
            const settings = (parsed && typeof parsed.settings === 'object') ? parsed.settings : {};

            return {
                type: 'CENTRAL_DE_SCRIPTS_FULL_BACKUP',
                version: String((parsed && parsed.version) || APP_VERSION),
                exportedAt: (parsed && parsed.exportedAt) || new Date().toISOString(),
                scripts: scripts,
                tabOrder: Array.isArray(parsed && parsed.tabOrder)
                    ? parsed.tabOrder.filter(id => typeof id === 'string' && scripts[id]).slice(0, 60)
                    : Object.keys(scripts),
                customDefaults: (parsed && typeof parsed.customDefaults === 'object' && !Array.isArray(parsed.customDefaults))
                    ? parsed.customDefaults
                    : {},
                clients: Array.isArray(parsed && parsed.clients)
                    ? parsed.clients.filter(c => c && typeof c === 'object').slice(0, 500)
                    : [],
                scratchpad: typeof (parsed && parsed.scratchpad) === 'string'
                    ? parsed.scratchpad.slice(0, 20000)
                    : '',
                userscripts: Array.isArray(parsed && parsed.userscripts)
                    ? parsed.userscripts.filter(u => u && typeof u === 'object').slice(0, 50)
                    : [],
                settings: {
                    theme: allowedThemes.includes(settings.theme) ? settings.theme : 'dark',
                    layout: allowedLayouts.includes(settings.layout) ? settings.layout : 'grid',
                    scale: clamp(Number(settings.scale) || 1, 0.7, 1.5),
                    activeTabId: typeof settings.activeTabId === 'string' ? settings.activeTabId.slice(0, 100) : '',
                    alarmConfig: (typeof settings.alarmConfig === 'object' && settings.alarmConfig) ? settings.alarmConfig : getAlarmConfig()
                }
            };
        }

        function validateImportPayload(rawInput) {
            const MAX_TABS = 60;
            const MAX_GROUPS_PER_TAB = 50;
            const MAX_CARDS_PER_TAB = 250;
            const MAX_TEXT_LEN = 12000;
            const MAX_TAGS_PER_CARD = 15;
            const MAX_TAG_LEN = 40;
            const MAX_TAB_NAME_LEN = 60;
            const MAX_GROUP_TITLE_LEN = 80;
            const MAX_CLIENTS = 500;
            const MAX_USERSCRIPTS = 60;
            const MAX_USERSCRIPT_SIZE = 100000; // 100 KB
            const ALLOWED_COLORS = ['', 'green', 'yellow', 'red', 'blue', 'purple'];
            const ALLOWED_THEMES = ['dark', 'oled', 'light'];
            const ALLOWED_LAYOUTS = ['grid', 'list'];

            if (!rawInput || typeof rawInput !== 'object') {
                return { valid: false, reason: 'Arquivo inválido: o conteúdo precisa ser um objeto JSON formatado.' };
            }

            // Sanitização imutável: clona profundamente para não mutar o objeto de entrada diretamente
            let parsed;
            try {
                parsed = JSON.parse(JSON.stringify(rawInput));
            } catch(e) {
                return { valid: false, reason: 'Falha ao processar estrutura do arquivo JSON.' };
            }

            const isFullBackup = parsed.type === 'CENTRAL_DE_SCRIPTS_FULL_BACKUP';
            const scripts = isFullBackup ? parsed.scripts : parsed;

            if (!scripts || typeof scripts !== 'object' || Array.isArray(scripts)) {
                return { valid: false, reason: 'Arquivo incompatível: nenhuma estrutura de abas de scripts encontrada.' };
            }

            const tabKeys = Object.keys(scripts);
            if (tabKeys.length === 0) {
                return { valid: false, reason: 'Arquivo vazio: o arquivo não contém nenhuma aba de scripts.' };
            }

            if (tabKeys.length > MAX_TABS) {
                return { valid: false, reason: `Arquivo excede o limite máximo permitido de ${MAX_TABS} abas.` };
            }

            for (const tabId of tabKeys) {
                if (typeof tabId !== 'string' || tabId.trim() === '') {
                    return { valid: false, reason: 'ID de aba inválido ou vazio encontrado.' };
                }
                const tab = scripts[tabId];
                if (!tab || typeof tab !== 'object' || typeof tab.name !== 'string' || !Array.isArray(tab.groups)) {
                    return { valid: false, reason: `Aba "${tabId}" possui formato inválido ou corrompido.` };
                }
                if (tab.name.trim() === '' || tab.name.length > MAX_TAB_NAME_LEN) {
                    return { valid: false, reason: `Nome da aba "${tabId}" é vazio ou excede ${MAX_TAB_NAME_LEN} caracteres.` };
                }
                if (tab.groups.length > MAX_GROUPS_PER_TAB) {
                    return { valid: false, reason: `Aba "${tab.name}" excede o limite de ${MAX_GROUPS_PER_TAB} grupos.` };
                }

                let totalCards = 0;
                for (const group of tab.groups) {
                    if (!group || typeof group !== 'object' || !Array.isArray(group.items)) {
                        return { valid: false, reason: `Grupo na aba "${tab.name}" possui formato inválido.` };
                    }
                    const gTitle = typeof group.title === 'string' ? group.title : '';
                    if (gTitle.length > MAX_GROUP_TITLE_LEN) {
                        return { valid: false, reason: `Título de grupo na aba "${tab.name}" excede ${MAX_GROUP_TITLE_LEN} caracteres.` };
                    }

                    totalCards += group.items.length;
                    if (totalCards > MAX_CARDS_PER_TAB) {
                        return { valid: false, reason: `A aba "${tab.name}" excede o limite máximo de ${MAX_CARDS_PER_TAB} cards.` };
                    }

                    for (const item of group.items) {
                        if (typeof item === 'string') {
                            if (item.length > MAX_TEXT_LEN) {
                                return { valid: false, reason: `Card na aba "${tab.name}" excede o limite de ${MAX_TEXT_LEN} caracteres.` };
                            }
                        } else if (item && typeof item === 'object') {
                            if (item.text !== undefined && typeof item.text !== 'string') {
                                return { valid: false, reason: `Card na aba "${tab.name}" possui campo de texto não textual.` };
                            }
                            const txt = item.text || '';
                            if (txt.length > MAX_TEXT_LEN) {
                                return { valid: false, reason: `Card na aba "${tab.name}" excede o limite de ${MAX_TEXT_LEN} caracteres.` };
                            }
                            if (item.color && !ALLOWED_COLORS.includes(item.color)) item.color = '';
                            if (item.alarm && typeof item.alarm !== 'string') item.alarm = '';
                            if (item.copies !== undefined && (typeof item.copies !== 'number' || isNaN(item.copies) || item.copies < 0)) item.copies = 0;

                            if (Array.isArray(item.tags)) {
                                if (item.tags.length > MAX_TAGS_PER_CARD) {
                                    return { valid: false, reason: `Card na aba "${tab.name}" excede o limite de ${MAX_TAGS_PER_CARD} tags.` };
                                }
                                for (const tag of item.tags) {
                                    if (typeof tag !== 'string' || tag.length > MAX_TAG_LEN) {
                                        return { valid: false, reason: `Tag inválida ou que excede o limite de ${MAX_TAG_LEN} caracteres.` };
                                    }
                                }
                            }
                        } else {
                            return { valid: false, reason: `Card na aba "${tab.name}" possui formato inválido.` };
                        }
                    }
                }
            }

            // Validações adicionais para Backup Completo
            if (isFullBackup) {
                if (parsed.clients) {
                    if (!Array.isArray(parsed.clients) || parsed.clients.length > MAX_CLIENTS) {
                        return { valid: false, reason: `Lista de clientes inválida ou que excede o limite de ${MAX_CLIENTS} registros.` };
                    }
                    for (const c of parsed.clients) {
                        if (!c || typeof c !== 'object') return { valid: false, reason: 'Registro de cliente com formato corrompido.' };
                        if (c.name && String(c.name).length > 120) return { valid: false, reason: 'Nome de cliente excede 120 caracteres.' };
                        if (c.contact && String(c.contact).length > 80) return { valid: false, reason: 'Contato de cliente excede 80 caracteres.' };
                        if (c.obs && String(c.obs).length > 600) return { valid: false, reason: 'Observação de cliente excede 600 caracteres.' };
                    }
                }

                if (parsed.userscripts) {
                    if (!Array.isArray(parsed.userscripts) || parsed.userscripts.length > MAX_USERSCRIPTS) {
                        return { valid: false, reason: `Lista de userscripts excede o limite de ${MAX_USERSCRIPTS} scripts.` };
                    }
                    for (const us of parsed.userscripts) {
                        if (!us || typeof us !== 'object' || typeof us.source !== 'string') {
                            return { valid: false, reason: 'Userscript com formato corrompido.' };
                        }
                        if (us.source.length > MAX_USERSCRIPT_SIZE) {
                            return { valid: false, reason: `Userscript "${us.name || 'sem nome'}" excede o limite de 100 KB.` };
                        }
                    }
                }

                if (parsed.tabOrder && Array.isArray(parsed.tabOrder)) {
                    // Garante que só referencie abas existentes nos scripts
                    parsed.tabOrder = parsed.tabOrder.filter(id => typeof id === 'string' && tabKeys.includes(id));
                }

                if (parsed.settings && typeof parsed.settings === 'object') {
                    const s = clean.settings;
                    if (s.theme && !ALLOWED_THEMES.includes(s.theme)) s.theme = 'dark';
                    if (s.layout && !ALLOWED_LAYOUTS.includes(s.layout)) s.layout = 'grid';
                    if (s.scale !== undefined) {
                        const sc = parseFloat(s.scale);
                        s.scale = (!isNaN(sc) && sc >= 0.6 && sc <= 1.8) ? sc : 1;
                    }
                }
            }

            return { valid: true, isFullBackup, scriptsCount: tabKeys.length, sanitizedData: parsed };
        }

        function importScripts(event) {
            const file = event.target.files[0];
            if (!file) return;
            const MAX_FILE_SIZE = 6 * 1024 * 1024; // 6 MB
            if (file.size > MAX_FILE_SIZE) {
                alert('⚠️ O arquivo selecionado é muito grande (limite máximo de 6 MB).');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    pushUndoSnapshot('Importação de Backup');

                    // Validação abrangente de limites, tipos e integridade
                    const validation = validateImportPayload(parsed);
                    if (!validation.valid) {
                        alert('⚠️ ' + validation.reason);
                        return;
                    }

                    // Cenário 1: Backup Completo Versionado
                    if (parsed && parsed.type === 'CENTRAL_DE_SCRIPTS_FULL_BACKUP' && parsed.scripts) {
                        if (!confirm(`Importar Backup Completo (v${parsed.version || '2.x'}) gravado em ${new Date(parsed.exportedAt || Date.now()).toLocaleString()}?\n\nIsso restaurará scripts, abas, clientes, variáveis e preferências.`)) return;

                        const clean = sanitizeFullBackup(validation.sanitizedData || parsed);
                        setAppData(clean.scripts);
                        if (Array.isArray(parsed.tabOrder)) saveTabOrder(clean.tabOrder);
                        if (parsed.customDefaults) setCustomDefaults(clean.customDefaults);
                        if (Array.isArray(parsed.clients)) setClientsData(clean.clients);
                        if (typeof parsed.scratchpad === 'string') {
                            localStorage.setItem(SCRATCHPAD_KEY, clean.scratchpad);
                            const scratchTa = document.getElementById('scratchpadText');
                            if (scratchTa) scratchTa.value = parsed.scratchpad;
                        }
                        if (Array.isArray(parsed.userscripts)) setUserscripts(clean.userscripts);

                        if (clean.settings) {
                            const s = parsed.settings;
                            if (s.theme) { localStorage.setItem(THEME_KEY, s.theme); changeTheme(s.theme); }
                            if (s.layout) { localStorage.setItem(LAYOUT_KEY, s.layout); setLayout(s.layout); }
                            if (s.scale) { localStorage.setItem(SCALE_KEY, s.scale); applyCardScale(parseFloat(s.scale) || 1); }
                            if (s.activeTabId) { currentActiveTabId = s.activeTabId; localStorage.setItem(ACTIVE_TAB_KEY, s.activeTabId); }
                            if (s.alarmConfig) localStorage.setItem(ALARM_CONFIG_KEY, JSON.stringify(s.alarmConfig));
                        }

                        markLocalChange();
                        loadAppData();
                        updateStorageIndicator();
                        updateUndoButton();
                        initAlarmConfigUI();
                        syncToCloudDebounced();

                        if (typeof showToast === 'function') {
                            showToast('✅ Backup completo restaurado com sucesso!', 'success');
                        } else {
                            alert('✅ Backup completo restaurado com sucesso!');
                        }
                        return;
                    }

                    // Cenário 2: Backup tradicional (somente scripts)
                    if (!isValidData(parsed)) {
                        alert('Arquivo JSON inválido: cada aba precisa ter "name" e estrutura correta de colunas.');
                        return;
                    }
                    if (!confirm('Importar ' + Object.keys(parsed).length + ' aba(s) de scripts? Isso substitui os scripts atuais.')) return;
                    setAppData(parsed);
                    markLocalChange();
                    currentActiveTabId = null;
                    loadAppData();
                    updateStorageIndicator();
                    updateUndoButton();
                    initAlarmConfigUI();
                    syncToCloudDebounced();

                    if (typeof showToast === 'function') {
                        showToast('Scripts importados com sucesso!', 'success');
                    } else {
                        alert('Scripts importados com sucesso!');
                    }
                } catch (err) {
                    alert('Erro ao processar arquivo: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function normalizeText(t) {
            if (t == null) return '';
            return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        }

        function filterScripts(query) {
            const raw = (query || '').trim();
            let isTagFilter = false;
            let targetTag = '';

            if (raw.toLowerCase().startsWith('tag:')) {
                isTagFilter = true;
                targetTag = normalizeText(raw.slice(4).trim());
            } else if (raw.startsWith('#')) {
                isTagFilter = true;
                targetTag = normalizeText(raw.slice(1).trim());
            }

            const q = normalizeText(raw);
            document.body.classList.toggle('searching', q !== '');

            document.querySelectorAll('.tab-content').forEach(tc => {
                if (tc.id === 'tab_clients_alarm') return;
                let hits = 0;
                tc.querySelectorAll('.item-card').forEach(card => {
                    const rawVal = card.querySelector('.item-textarea').value;
                    const preEl = card.querySelector('.item-text');
                    if (preEl && !isEditing) preEl.innerHTML = renderFormattedItemText(rawVal, q);
                    const txt = normalizeText(rawVal);
                    const tags = [...card.querySelectorAll('.card-tag')].map(t => normalizeText(t.dataset.tagName));
                    let match = false;
                    if (isTagFilter) {
                        match = targetTag === '' || tags.some(tag => tag.includes(targetTag) || targetTag.includes(tag));
                    } else {
                        const matchText = q === '' || txt.includes(q);
                        const matchTag = tags.some(tag => tag.includes(q) || q.includes(tag));
                        match = matchText || matchTag;
                    }
                    card.classList.toggle('nomatch', !match);
                    if (match) hits++;
                });
                tc.querySelectorAll('.column').forEach(col => col.classList.toggle('nomatch', q !== '' && !col.querySelector('.item-card:not(.nomatch)')));
                tc.classList.toggle('nomatch', q !== '' && hits === 0);
            });
        }

        function getStorageUsage() {
            let total = 0;
            const breakdown = { scripts: 0, clients: 0, vars: 0, userscripts: 0, other: 0 };
            try {
                for (let key in localStorage) {
                    if (Object.prototype.hasOwnProperty.call(localStorage, key)) {
                        const itemLen = (key.length + (localStorage.getItem(key) || '').length) * 2;
                        total += itemLen;
                        if (key.includes('dynamic_data')) breakdown.scripts += itemLen;
                        else if (key.includes('clients')) breakdown.clients += itemLen;
                        else if (key.includes('custom_defaults') || key.includes('vars')) breakdown.vars += itemLen;
                        else if (key.includes('userscript') || key.includes('scripts_us_')) breakdown.userscripts += itemLen;
                        else breakdown.other += itemLen;
                    }
                }
            } catch (e) {}
            const kb = (total / 1024).toFixed(1);
            const limitKb = 5120;
            const pct = Math.min(100, Math.round((total / (limitKb * 1024)) * 100));
            return { total, kb, pct, limitKb, breakdown };
        }

        function updateStorageIndicator() {
            const { kb, pct } = getStorageUsage();
            const el = document.getElementById('storageUsageText');
            const box = document.getElementById('storageIndicator');
            if (el && box) {
                el.textContent = `${kb} KB (${pct}%)`;
                box.classList.remove('warning', 'danger');
                if (pct >= 85) box.classList.add('danger');
                else if (pct >= 70) box.classList.add('warning');
                box.title = `Armazenamento local: ${kb} KB de aprox. 5 MB (${pct}%). Clique para ver detalhes de segurança.`;
            }
        }

        function clearAllScripts() {
            pushUndoSnapshot('Zerar Tudo');
            if (!confirm('⚠️ ATENÇÃO: Deseja realmente excluir TODOS os cards e abas, deixando a central totalmente zerada?\n\n(Recomendamos exportar um backup antes caso queira guardar seus scripts atuais).')) {
                return;
            }
            const emptyData = {
                tab_principal: {
                    name: "📝 Meus Scripts",
                    groups: [
                        {
                            title: "Geral",
                            items: [
                                { text: "", tags: [], alarm: "", favorite: false }
                            ]
                        }
                    ]
                }
            };
            setAppData(emptyData);

                    const style = targetDoc.createElement('style');

                    targetDoc.head.appendChild(style);
                } catch (err) {
                    if (sheet.href) {
                        const link = targetDoc.createElement('link');
                        link.rel = 'stylesheet';

                        targetDoc.head.appendChild(link);
                    }
                }
            });
        }

        function makePanelDraggable(panel, handle) {
            let dragging = false;
            let startX = 0, startY = 0, startLeft = 0, startTop = 0;

            const onMove = (e) => {
                if (!dragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let nl = startLeft + dx;
                let nt = startTop + dy;
                nl = Math.max(0, Math.min(nl, window.innerWidth - panel.offsetWidth));
                nt = Math.max(0, Math.min(nt, window.innerHeight - 40));
                panel.style.left = nl + 'px';
                panel.style.top = nt + 'px';
                panel.style.right = 'auto';
            };

            const onUp = () => {
                dragging = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };

            handle.addEventListener('mousedown', (e) => {
                if (e.target.closest('button, input, select')) return;
                const rect = panel.getBoundingClientRect();
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                e.preventDefault();
            });
        }

        function renderCompanionList() {
            const surface = companion.surface;
            if (!surface || !surface.refs) return;

            const doc = surface.doc;
            const list = surface.refs.list;
            const data = getAppData();
            const tab = data[companion.tabId];

            list.innerHTML = '';
            if (!tab) return;

            // Extrai todos os cards respeitando rigorosamente a ordem de colunas e cards do site
            const allItems = [];
            if (Array.isArray(tab.groups)) {
                tab.groups.forEach(g => {
                    if (Array.isArray(g.items)) {
                        g.items.forEach(item => {
                            allItems.push({
                                ...item,
                                groupTitle: g.title || ''
                            });
                        });
                    }
                });
            } else if (Array.isArray(tab.items)) {
                tab.items.forEach(item => allItems.push(item));
            }

            const query = companion.query.trim().toLowerCase();
            const filteredItems = allItems.filter(item => {
                const text = item.text || '';
                const tags = item.tags || [];
                const matchText = !query || text.toLowerCase().includes(query);
                const matchTag = tags.some(t => t.toLowerCase().includes(query));
                return matchText || matchTag;
            });

            // Se não houver busca ativa, favoritos vão para o topo preservando a ordem original entre si
            filteredItems.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0));

            surface.refs.count.textContent = `${filteredItems.length} de ${allItems.length} script(s)`;
            surface.refs.modeLabel.textContent = companion.compact ? 'Compacto' : 'Completo';

            if (filteredItems.length === 0) {
                const empty = doc.createElement('div');
                empty.className = 'comp-empty';
                empty.textContent = 'Nenhum script encontrado.';
                list.appendChild(empty);
                return;

            let lastGroup = '';
            filteredItems.forEach((item, idx) => {
                // Separador visual de coluna/grupo na Dock quando não compacto
                if (!companion.compact && item.groupTitle && item.groupTitle !== lastGroup && !query) {

        function firstLineOf(text) {

        /* ============================================================
           USERSCRIPTS — formato Tampermonkey
           ============================================================ */
        const USERSCRIPTS_KEY = 'scripts_userscripts_v1';

        function getUserscripts() {
            try {
                const raw = localStorage.getItem(USERSCRIPTS_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) { return []; }
        }

        function setUserscripts(list) {
            try { localStorage.setItem(USERSCRIPTS_KEY, JSON.stringify(list)); }
            catch (e) { alert('Não foi possível salvar os userscripts.'); }
        }

        function parseUserscriptMeta(source) {
            const meta = {};
            const block = source.match(/\/\/\s*==UserScript==([\s\S]*?)\/\/\s*==\/UserScript==/i);
            if (!block) return meta;
            const lines = block[1].split(/\r?\n/);
            lines.forEach(line => {
                const m = line.match(/^\s*\/\/\s*@(\S+)(?:\s+(.*?))?\s*$/);
                if (!m) return;
                const key = m[1];
                const value = (m[2] || '').trim();
                if (meta[key] === undefined) meta[key] = value;
                else if (Array.isArray(meta[key])) meta[key].push(value);
                else meta[key] = [meta[key], value];
            });
            return meta;
        }

        function userscriptMatches(source, url = location.href) {
            const meta = parseUserscriptMeta(source);
            let matches = meta.match || meta.include || '*';
            if (!Array.isArray(matches)) matches = [matches];

            return matches.some(pattern => {
                if (!pattern || pattern === '*') return true;
                if (pattern.startsWith('http://') || pattern.startsWith('https://') || pattern.startsWith('file://')) {
                    const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
                    try { return new RegExp('^' + escaped + '$', 'i').test(url); } catch (e) { return false; }
                }
                return false;
            });
        }

        function userscriptApi(script) {
            const storeKey = 'scripts_us_' + btoa(unescape(encodeURIComponent(script.name || 'script'))).replace(/[^a-z0-9]/gi, '_');
            return {
                GM_getValue(key, fallback = null) {
                    try {
                        const data = JSON.parse(localStorage.getItem(storeKey) || '{}');
                        return Object.prototype.hasOwnProperty.call(data, key) ? data[key] : fallback;
                    } catch (e) { return fallback; }
                },
                GM_setValue(key, value) {
                    try {
                        const data = JSON.parse(localStorage.getItem(storeKey) || '{}');
                        data[key] = value;
                        localStorage.setItem(storeKey, JSON.stringify(data));
                    } catch (e) {}
                },
                GM_deleteValue(key) {
                    try {
                        const data = JSON.parse(localStorage.getItem(storeKey) || '{}');
                        delete data[key];
                        localStorage.setItem(storeKey, JSON.stringify(data));
                    } catch (e) {}
                },
                GM_listValues() {
                    try { return Object.keys(JSON.parse(localStorage.getItem(storeKey) || '{}')); }
                    catch (e) { return []; }
                },
                GM_addStyle(css) {
                    const style = document.createElement('style');
                    style.textContent = css;
                    document.head.appendChild(style);
                    return style;
                },
                GM_openInTab(url) { return window.open(url, '_blank'); },
                GM_notification(text, title) {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        try { return new Notification(title || 'Userscript', { body: text }); } catch (e) {}
                    }
                }
            };
        }

        function runUserscript(source, targetWindow = window) {
            const foundScript = getUserscripts().find(item => item.source === source);
            if (foundScript && foundScript.trusted !== true) {
                return { ok: false, reason: 'Este userscript ainda não foi marcado como confiável pelo atendente.' };
            }
            const meta = parseUserscriptMeta(source);
            if (!userscriptMatches(source, targetWindow.location.href)) return { ok:false, reason:'@match/@include não corresponde à URL atual.' };

            const script = {
                name: Array.isArray(meta.name) ? meta.name[0] : (meta.name || (foundScript && foundScript.name) || 'Userscript')
            };
            const api = userscriptApi(script);

            try {
                const runner = new Function(
                    'window', 'document', 'unsafeWindow',
                    'GM_getValue', 'GM_setValue', 'GM_deleteValue', 'GM_listValues',
                    'GM_addStyle', 'GM_openInTab', 'GM_notification',
                    source.replace(/\/\/\s*==UserScript==[\s\S]*?\/\/\s*==\/UserScript==/i, '')
                );
                runner.call(targetWindow, targetWindow, targetWindow.document, targetWindow,
                    api.GM_getValue.bind(api), api.GM_setValue.bind(api),
                    api.GM_deleteValue.bind(api), api.GM_listValues.bind(api),
                    api.GM_addStyle.bind(api), api.GM_openInTab.bind(api),
                    api.GM_notification.bind(api));
                return { ok:true };
            } catch (e) {
                console.error('[Userscript]', script.name, e);

        const MAX_USERSCRIPT_SIZE = 300 * 1024; // 300 KB
        const MAX_USERSCRIPTS = 50;

        function validateUserscriptSource(source) {
            if (typeof source !== 'string' || !source.trim()) {
                return 'Userscript vazio.';
            }
            if (source.length > MAX_USERSCRIPT_SIZE) {
                return 'Userscript excede o limite máximo permitido de 300 KB.';
            }
            const meta = parseUserscriptMeta(source);
            if (!meta.name) {
                return 'Userscript sem metadado @name no cabeçalho.';
            }
            if (!meta.match && !meta.include) {
                return 'Userscript sem metadados @match ou @include.';
            }
            return null;
        }

        function importUserscripts(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            const scripts = getUserscripts();
            let pending = files.length;
            let importedCount = 0;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    const source = String(e.target.result || '');
                    const error = validateUserscriptSource(source);
                    if (error) {
                        alert(`⚠️ ${file.name}: ${error}`);
                    } else if (scripts.length >= MAX_USERSCRIPTS) {
                        alert(`⚠️ Limite máximo de ${MAX_USERSCRIPTS} userscripts atingido.`);
                    } else {
                        const meta = parseUserscriptMeta(source);
                        const id = (typeof crypto !== 'undefined' && crypto.randomUUID)
                            ? crypto.randomUUID()
                            : `us-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

                        scripts.push({
                            id,
                            name: meta.name || file.name,
                            enabled: false,
                            trusted: false,
                            origin: file.name,
                            importedAt: new Date().toISOString(),
                            source
                        });
                        importedCount++;
                    }

                    if (--pending === 0) {
                        setUserscripts(scripts);
                        if (importedCount > 0) {
                            if (typeof showToast === 'function') {
                                showToast(`${importedCount} userscript(s) importado(s) com segurança (desativados).`, 'info');
                            } else {
                                alert(`${importedCount} userscript(s) importado(s) em modo seguro (desativados por padrão).`);
                            }
                        }
                    }
                };
                reader.readAsText(file);
            });
            event.target.value = '';
        }

        function compareVersions(a, b) {
            const pa = String(a || '0').replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
            const pb = String(b || '0').replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
            for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const x = pa[i] || 0, y = pb[i] || 0;
                if (x > y) return 1;
                if (x < y) return -1;
            }
            return 0;
        }

                const manifest = await response.json();

        function applyCloudDataToLocal(cloudData) {
            if (!cloudData || !cloudData.scripts || !isValidData(cloudData.scripts)) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData.scripts));
            if (Array.isArray(cloudData.tabOrder)) {
                localStorage.setItem(TAB_ORDER_KEY, JSON.stringify(cloudData.tabOrder));
            }
            if (cloudData.customDefaults) {
                localStorage.setItem(VARS_KEY, JSON.stringify(cloudData.customDefaults));
            }
            if (cloudData.clients) {
                localStorage.setItem(CLIENTS_KEY, JSON.stringify(cloudData.clients));
            }
            if (typeof cloudData.scratchpad === 'string') {
                localStorage.setItem(SCRATCHPAD_KEY, cloudData.scratchpad);
                const scratchTa = document.getElementById('scratchpadText');
                if (scratchTa) scratchTa.value = cloudData.scratchpad;
            }
            if (cloudData.settings) {
                const s = cloudData.settings;
                if (s.theme) {
                    localStorage.setItem(THEME_KEY, s.theme);
                    changeTheme(s.theme);
                }
                if (s.layout) {
                    localStorage.setItem(LAYOUT_KEY, s.layout);
                    setLayout(s.layout);
                }
                if (s.scale) {
                    localStorage.setItem(SCALE_KEY, s.scale);
                    applyCardScale(parseFloat(s.scale) || 1);
                }
                if (s.activeTabId) {
                    currentActiveTabId = s.activeTabId;
                    localStorage.setItem(ACTIVE_TAB_KEY, s.activeTabId);
                }
                if (s.alarmConfig) {
                    localStorage.setItem(ALARM_CONFIG_KEY, JSON.stringify(s.alarmConfig));
                }
            }
            loadAppData();
            updateStorageIndicator();
            updateUndoButton();
            initAlarmConfigUI();
        }

        async function syncFromCloud() {
            if (!currentUser || !firebaseDb) return;
            try {
                const dataDocRef = firebaseDb.collection('users').doc(currentUser.uid).collection('settings').doc('app_data');
                const snap = await dataDocRef.get();
                if (snap.exists) {
                    const cloudData = snap.data();
                    if (cloudData && cloudData.scripts && isValidData(cloudData.scripts)) {
                        // Verifica se os dados locais são mais recentes que a nuvem para evitar sobrescrever edições recentes
                        const cloudTime = cloudData.updatedAt ? new Date(cloudData.updatedAt).getTime() : 0;
                        const localTime = parseInt(localStorage.getItem(LAST_LOCAL_UPDATE_KEY) || '0', 10);

                        if (localTime > (cloudTime + 2000)) {
                            console.log('Alterações locais mais recentes detectadas. Sincronizando do navegador para a Nuvem...');
                            await syncToCloud();
                            return;
                        }

                        // Detecção inteligente de conflito entre computadores distintos
                        if (await checkRemoteConflict(cloudData)) {
                            console.warn('Conflito remoto detectado entre dispositivos.');
                            showConflictModal({ localData: buildSyncPayload(), remoteData: cloudData });
                            return;
                        }

                        applyCloudDataToLocal(cloudData);
                        console.log('Dados, ordem das abas e configurações sincronizados da nuvem com sucesso!');
                    }
                } else {
                    // Primeiro login do usuário: salva os dados locais atuais na nuvem
                    await syncToCloud();
                }
            } catch (e) {
                updateSyncStatusUI(navigator.onLine ? 'error' : 'offline');
                console.warn('Sincronização da nuvem indisponível (usando cache local):', e);
            }
        }

        
        /* ============================================================
           V2.5.3: FILA DE SINCRONIZAÇÃO OFFLINE COM RETRY E BACKOFF
           ============================================================ */
        let syncStatus = 'synced'; // 'synced', 'pending', 'syncing', 'error', 'offline'
        let pendingSyncPayload = null;
        let syncRetryCount = 0;
        let syncRetryTimer = null;

        function updateSyncStatusUI(status, message = '') {
            syncStatus = status;
            const dot = document.querySelector('.auth-status-dot');
            const statusNotice = document.getElementById('cloudSyncStatusNotice');

            if (dot) {
                dot.className = 'auth-status-dot';
                if (!navigator.onLine) {
                    dot.classList.add('offline');
                    dot.title = 'Offline: Alterações sendo salvas no navegador';
                } else if (status === 'syncing') {
                    dot.classList.add('syncing');
                    dot.title = 'Nuvem do Google: Sincronizando dados...';
                } else if (status === 'error') {
                    dot.classList.add('error');
                    dot.title = 'Aviso: Falha ao sincronizar na Nuvem. Clique para tentar novamente.';
                } else if (status === 'pending') {
                    dot.classList.add('pending');
                    dot.title = 'Alterações locais salvas (sincronização agendada)';
                } else {
                    dot.classList.add('online');
                    dot.title = 'Nuvem do Google: Sincronizado e Conectado';
                }
            }

            if (statusNotice) {
                const labels = {
                    syncing: '🔄 Sincronizando com a Nuvem do Google...',
                    offline: '⚡ Modo Offline: Dados salvos localmente no navegador.',
                    pending: '💾 Salvo localmente (pendente de envio para a nuvem).',
                    error: '⚠️ Falha na sincronização com a Nuvem.',
                    synced: '🟢 Seus scripts e configurações estão sincronizados na Nuvem do Google.'
                };
                statusNotice.textContent = message || labels[status] || '';
                statusNotice.className = 'cloud-status-pill ' + status;
                statusNotice.dataset.status = status;
            }
        }

        window.addEventListener('online', () => {
            if (typeof showToast === 'function') showToast('🌐 Conexão à internet restabelecida!', 'info');
            updateSyncStatusUI(pendingSyncPayload ? 'pending' : 'synced');
            if (pendingSyncPayload) processSyncQueue();
        });

        window.addEventListener('offline', () => {
            if (typeof showToast === 'function') showToast('⚡ Conexão offline: dados mantidos com segurança no navegador.', 'warning');
            updateSyncStatusUI('offline');
        });

        function scheduleSyncRetry(payload) {
            syncRetryCount++;
            const delay = Math.min(30000, 3000 * Math.pow(1.8, syncRetryCount - 1));
            clearTimeout(syncRetryTimer);
            syncRetryTimer = setTimeout(() => {
                if (navigator.onLine && pendingSyncPayload) processSyncQueue();
            }, delay);
        }

        async function processSyncQueue() {
            if (!currentUser || !firebaseDb || isCloudSyncing) return;
            if (!navigator.onLine) {
                updateSyncStatusUI('offline');
                return;
            }

            const revisionAtStart = localRevision;
            const payloadToSync = pendingSyncPayload || buildSyncPayload();

            isCloudSyncing = true;
            updateSyncStatusUI('syncing');

            try {
                const dataDocRef = firebaseDb
                    .collection('users')
                    .doc(currentUser.uid)
                    .collection('settings')
                    .doc('app_data');

                await dataDocRef.set(payloadToSync, { merge: true });
                lastSyncedRevision = revisionAtStart;
                const nowIso = new Date().toISOString();
                localStorage.setItem(LAST_LOCAL_UPDATE_KEY, String(Date.now()));
                localStorage.setItem(LAST_SYNC_TIME_KEY, nowIso);

                // Condição estrita: fila só é limpa se nenhuma nova alteração ocorreu durante o envio
                if (localRevision === revisionAtStart) {
                    pendingSyncPayload = null;
                    syncRetryCount = 0;
                    clearTimeout(syncRetryTimer);
                    updateSyncStatusUI('synced');
                    console.log('Alterações sincronizadas na Nuvem com sucesso (rev ' + revisionAtStart + ')!');
                } else {
                    // Uma nova alteração ocorreu durante o envio
                    pendingSyncPayload = buildSyncPayload();
                    updateSyncStatusUI('pending');
                    setTimeout(() => processSyncQueue(), 0);
                }
            } catch (err) {
                console.warn('Erro ao processar sincronização na nuvem:', err);
                pendingSyncPayload = payloadToSync;
                updateSyncStatusUI(navigator.onLine ? 'error' : 'offline');
                scheduleSyncRetry(payloadToSync);
            } finally {
                isCloudSyncing = false;
            }
        }

        function manualRetrySync() {
            syncRetryCount = 0;
            processSyncQueue();
        }

        /* Função para o Administrador publicar seus scripts atuais como padrão global para toda a equipe */
        async function pushCurrentScriptsAsTeamDefault() {
            if (!isCurrentUserAdmin()) {
                alert('Apenas administradores podem definir o padrão corporativo da equipe.');
                return;
            }
            if (!confirm('Deseja publicar TODOS os seus scripts atuais como o modelo padrão oficial da equipe no Firestore?\n\nTodos os novos atendentes que entrarem na Central receberão exatamente esta base de 11 abas.')) return;
            
            try {
                const payload = buildSyncPayload();
                await Promise.all([
                    firebaseDb.collection('templates').doc('default_scripts').set(payload, { merge: true }),
                    firebaseDb.collection('global_settings').doc('default_scripts').set(payload, { merge: true })
                ]);

                if (typeof registerAdminAudit === 'function') {
                    await registerAdminAudit('PUBLISH_TEAM_DEFAULTS', {
                        title: 'Publicação de Scripts Padrão da Equipe',
                        tabsCount: Object.keys(payload.scripts || {}).length
                    });

                if (typeof showToast === 'function') {
                    showToast('🚀 Scripts publicados como padrão oficial da equipe com sucesso!', 'success');
                } else {
                    alert('🚀 Scripts publicados como padrão oficial da equipe com sucesso!');
                }
            } catch (err) {
                alert('Erro ao publicar scripts como padrão da equipe: ' + (err.message || err));
            }
        }
        window.pushCurrentScriptsAsTeamDefault = pushCurrentScriptsAsTeamDefault;

        async function syncToCloud() {
            if (!currentUser || !firebaseDb) return;
            pendingSyncPayload = buildSyncPayload();
            updateSyncStatusUI('pending');
            await processSyncQueue();
        }

        function syncToCloudDebounced() {
            if (!currentUser || !firebaseDb) return;
            clearTimeout(cloudSyncDebounceTimer);
            cloudSyncDebounceTimer = setTimeout(() => {
                syncToCloud();

                    lastCopyAt: new Date().toISOString()

        /* Modal com Prévia antes de Baixar da Nuvem */
        async function openCloudDownloadPreviewModal() {
            if (!currentUser || !firebaseDb) {
                alert('Você precisa estar conectado com sua conta Google para baixar da nuvem.');
                return;
            }

            const loadOverlay = document.createElement('div');
            loadOverlay.className = 'var-modal-overlay';
            loadOverlay.setAttribute('data-transient', 'true');
            loadOverlay.innerHTML = `
                <div class="var-modal-box vm-box" style="width:340px; text-align:center; padding:24px;">
                    <div style="font-size:26px; margin-bottom:10px;">⏳</div>
                    <div style="font-weight:600; font-size:13.5px;">Buscando backup na Nuvem do Google...</div>
                </div>
            `;
            document.body.appendChild(loadOverlay);

            try {
                const dataDocRef = firebaseDb.collection('users').doc(currentUser.uid).collection('settings').doc('app_data');
                let snap = null;
                try {
                    const snapPromise = dataDocRef.get();
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Tempo limite excedido ao buscar na nuvem.')), 7000));
                    snap = await Promise.race([snapPromise, timeoutPromise]);
                } catch(e) {
                    console.warn('Erro ao consultar backup pessoal:', e);
                }

                let cloudData = (snap && snap.exists) ? snap.data() : null;
                let isTeamDefault = false;

                if (!cloudData || !cloudData.scripts || !isValidData(cloudData.scripts)) {
                    // Tenta obter o padrão corporativo da equipe
                    try {
                        const tmplRef = firebaseDb.collection('templates').doc('default_scripts');
                        const tmplSnap = await tmplRef.get();
                        if (tmplSnap.exists && tmplSnap.data() && tmplSnap.data().scripts && isValidData(tmplSnap.data().scripts)) {
                            cloudData = tmplSnap.data();
                            isTeamDefault = true;
                        }
                    } catch(e) {}
                }

                loadOverlay.remove();

                if (!cloudData || !cloudData.scripts || !isValidData(cloudData.scripts)) {
                    alert('Nenhum backup de scripts encontrado na nuvem para a sua conta Google.\n\nDica: use o botão "Salvar meus Scripts na Nuvem" primeiro para enviar seus scripts atuais.');
                    return;
                }

                const cloudScripts = cloudData.scripts;
                const cloudTabIds = Array.isArray(cloudData.tabOrder) && cloudData.tabOrder.length
                    ? cloudData.tabOrder.filter(id => cloudScripts[id])
                    : Object.keys(cloudScripts);
                let cloudTotalCards = 0;
                const cloudTabSummary = [];

                cloudTabIds.forEach(id => {
                    const tab = cloudScripts[id];
                    let count = 0;
                    if (Array.isArray(tab.groups)) {
                        tab.groups.forEach(g => {
                            if (Array.isArray(g.items)) count += g.items.length;
                        });
                    }
                    cloudTotalCards += count;
                    cloudTabSummary.push({ name: tab.name, count });
                });

                // Dados locais para comparação
                const localData = getAppData();
                const localTabIds = Object.keys(localData);
                let localTotalCards = 0;
                localTabIds.forEach(id => {
                    const tab = localData[id];
                    if (Array.isArray(tab.groups)) {
                        tab.groups.forEach(g => { if (Array.isArray(g.items)) localTotalCards += g.items.length; });
                    }
                });

                const cloudDateStr = cloudData.updatedAt ? new Date(cloudData.updatedAt).toLocaleString() : 'Data não registrada';

                const overlay = document.createElement('div');
                overlay.className = 'var-modal-overlay';
                overlay.setAttribute('data-transient', 'true');

                overlay.innerHTML = `
                    <div class="var-modal-box vm-box" style="width: min(550px, 94vw);">
                        <div class="vm-head">
                            <div class="vm-title">📥 Prévia: Baixar Scripts da Nuvem do Google</div>

                        </div>
                        <div class="vm-body" style="padding: 18px 20px; gap: 14px;">
                            <div style="font-size: 12.5px; line-height: 1.5; opacity: 0.9;">
                                Encontramos o seguinte backup na <strong>Nuvem do Google</strong> ${isTeamDefault ? '<span class="admin-badge role-admin" style="margin-left:4px;">Padrão da Equipe</span>' : '<span class="admin-badge status-active" style="margin-left:4px;">Seu Backup Pessoal</span>'}. Confira a comparação:
                            </div>

                            <!-- Comparativo de Versão Nuvem vs Local -->
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                                <div style="background:rgba(37,99,235,0.08); border:1.5px solid #2563eb; border-radius:10px; padding:10px 14px;">
                                    <div style="font-size:11px; font-weight:700; color:#2563eb; text-transform:uppercase;">☁️ Backup na Nuvem</div>
                                    <div style="margin-top:6px; font-size:12px; line-height:1.5;">
                                        • <strong>${cloudTabIds.length}</strong> abas &nbsp;|&nbsp; <strong>${cloudTotalCards}</strong> scripts
                                        <br><span style="font-size:11px; opacity:0.8;">Data: ${cloudDateStr}</span>
                                    </div>
                                </div>
                                <div style="background:var(--tab-bg); border:1px solid var(--border-color); border-radius:10px; padding:10px 14px;">
                                    <div style="font-size:11px; font-weight:700; opacity:0.75; text-transform:uppercase;">💻 Versão Atual no Navegador</div>
                                    <div style="margin-top:6px; font-size:12px; line-height:1.5;">
                                        • <strong>${localTabIds.length}</strong> abas &nbsp;|&nbsp; <strong>${localTotalCards}</strong> scripts
                                        <br><span style="font-size:11px; opacity:0.8;">Armazenado localmente</span>
