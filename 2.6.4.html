                                ${cloudTabSummary.map(t => `<div style="display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dashed rgba(255,255,255,0.06);"><span>${escapeHtml(t.name)}</span><span style="opacity:0.75; font-weight:600;">${t.count} scripts</span></div>`).join('')}
                            </div>

                            <div style="font-size: 11.5px; opacity: 0.9; line-height: 1.4; background: rgba(234, 179, 8, 0.08); border: 1px solid rgba(234, 179, 8, 0.3); padding: 9px 12px; border-radius: 8px;">
                                ⚠️ <strong>Atenção:</strong> Ao confirmar o download, os scripts atuais do seu navegador serão substituídos pela versão da Nuvem. Será criado um ponto de restauração para desfazer com Ctrl+Z se necessário.
                            </div>
                        </div>
                        <div class="vm-foot" style="padding: 12px 20px; justify-content: space-between;">
                            <button class="var-modal-btn var-modal-btn-cancel" onclick="this.closest('.var-modal-overlay').remove()">Cancelar</button>
                            <button class="var-modal-btn var-modal-btn-confirm" id="btnConfirmDownloadAction" style="background:#2563eb;">
                                📥 Confirmar e Restaurar Scripts
                            </button>
                        </div>
                    </div>
                `;

                overlay.querySelector('#btnConfirmDownloadAction').onclick = () => {
                    pushUndoSnapshot('Download da Nuvem');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData.scripts));
                    if (Array.isArray(cloudData.tabOrder)) {
                        localStorage.setItem(TAB_ORDER_KEY, JSON.stringify(cloudData.tabOrder));
                    }
                    if (cloudData.customDefaults) {
                        localStorage.setItem(VARS_KEY, JSON.stringify(cloudData.customDefaults));
                    }
                    if (cloudData.clients) {
                        localStorage.setItem(CLIENTS_KEY, JSON.stringify(cloudData.clients));
                    }
                    if (typeof cloudData.scratchpad === 'string') {
                        localStorage.setItem(SCRATCHPAD_KEY, cloudData.scratchpad);
                        const scratchTa = document.getElementById('scratchpadText');
                        if (scratchTa) scratchTa.value = cloudData.scratchpad;
                    }
                    if (cloudData.settings) {
                        const s = cloudData.settings;
                        if (s.theme) { localStorage.setItem(THEME_KEY, s.theme); changeTheme(s.theme); }
                        if (s.layout) { localStorage.setItem(LAYOUT_KEY, s.layout); setLayout(s.layout); }
                        if (s.scale) { localStorage.setItem(SCALE_KEY, s.scale); applyCardScale(parseFloat(s.scale) || 1); }
                        if (s.activeTabId) { currentActiveTabId = s.activeTabId; localStorage.setItem(ACTIVE_TAB_KEY, s.activeTabId); }
                        if (s.alarmConfig) { localStorage.setItem(ALARM_CONFIG_KEY, JSON.stringify(s.alarmConfig)); }
                    }
                    localStorage.setItem(LAST_LOCAL_UPDATE_KEY, String(Date.now()));
                    loadAppData();
                    updateStorageIndicator();
                    updateUndoButton();
                    initAlarmConfigUI();

                    overlay.remove();
                    if (typeof showToast === 'function') {
                        showToast('✅ Scripts e configurações restaurados da Nuvem com sucesso!', 'success');
                    } else {
                        alert('✅ Scripts e configurações baixados e restaurados da Nuvem com sucesso!');
                    }
                };

                document.body.appendChild(overlay);

            } catch (err) {
                loadOverlay.remove();
                alert('Erro ao buscar backup na nuvem: ' + (err.message || err));
            }
        }

service cloud.firestore {
  match /databases/{database}/documents {

    // Função auxiliar: identifica administradores autorizados pela lista mestra
    function isAdmin() {
      return request.auth != null && (
        request.auth.token.email in ['leogabfx@gmail.com', 'leonardo3dtelecom@gmail.com'] ||
        (exists(/databases/$(database)/documents/users/$(request.auth.uid)) &&
         get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin')
      );
    }

    // Regras de segurança granulares da coleção de usuários
    match /users/{userId} {
      // Leitura permitida para o próprio usuário e para administradores
      allow read: if request.auth != null && (request.auth.uid == userId || isAdmin());

      // Criação inicial no primeiro login: role deve ser 'user' (ou admin apenas se for admin mestre)
      allow create: if request.auth != null && request.auth.uid == userId &&
        (request.resource.data.role == 'user' || request.auth.token.email in ['leogabfx@gmail.com', 'leonardo3dtelecom@gmail.com']) &&
        request.resource.data.status == 'active';

      // Atualização de perfil: administradores podem alterar qualquer campo;
      // Usuários comuns NÃO podem alterar 'role' nem 'status' no seu próprio perfil.
      allow update: if request.auth != null && (
        isAdmin() || (
          request.auth.uid == userId &&
          !request.resource.data.diff(resource.data).affectedKeys().hasAny(['role', 'status'])
        )
      );

      // Exclusão permitida apenas para administradores mestres
      allow delete: if isAdmin();

      // Subcoleção de scripts e configurações privadas do atendente
      match /settings/{docId} {
        allow read, write: if request.auth != null && (request.auth.uid == userId || isAdmin());
      }
    }

    // Modelos oficiais e scripts corporativos globais da equipe
    match /templates/{docId} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }

    match /global_settings/{docId} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }

    // Trilha de auditoria administrativa (somente gravação e leitura por administradores)
    match /audit_logs/{logId} {
      allow create: if isAdmin();
      allow read: if isAdmin();
      allow update, delete: if false;
    }
  }
}`;

            let allUsersList = [];

            async function loadAdminUsers() {
                const tbody = overlay.querySelector('#admUserTableBody');
                if (!firebaseDb) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#dc2626; padding:20px;">Banco de dados Firestore não conectado.</td></tr>`;
                    return;
                }
                try {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:24px; opacity:0.8;">⏳ Conectando e consultando usuários da equipe no Firestore...</td></tr>`;
                    
                    const fetchPromise = firebaseDb.collection('users').get();
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Tempo limite excedido ao consultar o Firestore (verifique a internet ou as Regras de Segurança do Firebase).')), 7000)
                    );
                    
                    const snap = await Promise.race([fetchPromise, timeoutPromise]);
                    allUsersList = [];
                    snap.forEach(doc => allUsersList.push({ id: doc.id, ...doc.data() }));

                    renderAdminUsersTable();
                } catch (e) {
                    console.error('Erro no painel admin ao carregar usuários:', e);
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align:center; padding:24px; color:#f87171;">
                                <div style="font-weight:700; font-size:14px; margin-bottom:6px;">⚠️ Não foi possível carregar a lista de usuários</div>
                                <div style="font-size:12px; opacity:0.9; margin-bottom:12px;">${escapeHtml(e.message || e)}</div>
                                <div style="font-size:11.5px; opacity:0.8; max-width:550px; margin:0 auto; line-height:1.45; background:rgba(0,0,0,0.25); padding:10px 14px; border-radius:8px; border:1px solid rgba(248,113,113,0.3); text-align:left;">
                                    <strong>Causa mais provável:</strong> As Regras de Segurança (Rules) do Firestore no Firebase Console precisam permitir a leitura da coleção <code>users</code>.
                                    <div style="margin-top:8px; text-align:center;">
                                        <button type="button" class="io-btn" style="background:#2563eb; font-size:11px; padding:6px 12px;" onclick="openFirestoreRulesModal()">📋 Ver Regras Recomendadas do Firestore</button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }

            function renderAdminUsersTable() {
                const tbody = overlay.querySelector('#admUserTableBody');
                const filter = (overlay.querySelector('#admSearchUserInput').value || '').toLowerCase().trim();

                let total = allUsersList.length;
                let active = 0;
                let blocked = 0;
                let totalCopies = 0;

                allUsersList.forEach(u => {
                    if (u.status === 'blocked') blocked++;
                    else active++;
                    totalCopies += (parseInt(u.scriptCopies) || 0);
                });

                overlay.querySelector('#admTotalUsers').textContent = total;
                overlay.querySelector('#admActiveUsers').textContent = active;
                overlay.querySelector('#admBlockedUsers').textContent = blocked;
                overlay.querySelector('#admTotalCopies').textContent = totalCopies;

                const filtered = allUsersList.filter(u => {
                    if (!filter) return true;
                    return (u.displayName || '').toLowerCase().includes(filter) ||
                           (u.email || '').toLowerCase().includes(filter);
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align:center; padding:28px; opacity:0.85;">
                                <div style="font-size:22px; margin-bottom:8px;">👥</div>
                                <div style="font-weight:700; font-size:13.5px;">Nenhum usuário registrado encontrado na coleção 'users'.</div>
                                <div style="font-size:11.5px; opacity:0.75; margin-top:4px; max-width:500px; margin-left:auto; margin-right:auto; line-height:1.4;">
                                    Se atendentes como <strong>Alexandre</strong> já fizeram login pelo Google e não aparecem aqui, é porque a permissão de gravação da coleção <code>users</code> precisa ser liberada no Firebase Console.
                                </div>
                                <div style="margin-top:10px;">
                                    <button type="button" class="io-btn" style="background:#2563eb; font-size:11.5px; padding:6px 14px;" onclick="openFirestoreRulesModal()">📋 Ver e Copiar Regras do Firestore</button>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = '';
                filtered.forEach(u => {
                    const tr = document.createElement('tr');
                    const isSuperAdmin = DEFAULT_ADMIN_EMAILS.some(a => a.toLowerCase() === (u.email || '').toLowerCase());
                    const isAdmin = u.role === 'admin' || isSuperAdmin;
                    const isBlocked = u.status === 'blocked';
                    const lastLoginStr = u.lastLogin ? new Date(u.lastLogin).toLocaleString() : 'Nunca';

                    tr.innerHTML = `
                        <td>
                            <div style="display:flex; align-items:center; gap:8px;">
                                ${u.photoURL ? `<img src="${u.photoURL}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">` : `<span style="width:24px; height:24px; border-radius:50%; background:#7c3aed; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;">${(u.displayName || u.email || 'U')[0].toUpperCase()}</span>`}
                                <strong>${escapeHtml(u.displayName || 'Sem nome')}</strong>
                            </div>
                        </td>
                        <td>${escapeHtml(u.email || '')}</td>
                        <td><small style="opacity:0.8;">${lastLoginStr}</small></td>
                        <td><strong>${u.scriptCopies || 0}</strong> cópias</td>
                        <td>
                            <span class="admin-badge ${isAdmin ? 'role-admin' : 'role-user'}">${isAdmin ? '🛡️ Admin' : '👤 Usuário'}</span>
                        </td>
                        <td>
                            <span class="admin-badge ${isBlocked ? 'status-blocked' : 'status-active'}">${isBlocked ? '🚫 Bloqueado' : '✅ Ativo'}</span>
                        </td>
                        <td style="text-align:right;">
                            ${isSuperAdmin ? `<span style="font-size:11px; opacity:0.6; font-style:italic;">Admin Primário</span>` : `
                                <div style="display:inline-flex; gap:6px;">
                                    <button class="comp-btn comp-btn-secondary" style="font-size:10.5px; padding:3px 7px;" onclick="window.toggleUserRole('${u.id}', '${u.role || 'user'}')">
                                        ${isAdmin ? 'Tornar Usuário' : 'Promover Admin'}
                                    </button>
                                    <button class="comp-btn comp-btn-secondary" style="font-size:10.5px; padding:3px 7px; color:${isBlocked ? '#16a34a' : '#dc2626'};" onclick="window.toggleUserStatus('${u.id}', '${u.status || 'active'}')">
                                        ${isBlocked ? 'Desbloquear' : 'Bloquear'}
                                    </button>
                                </div>
                            `}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            window.toggleUserRole = async function(userId, currentRole) {
                const target = allUsersList.find(u => u.id === userId);
                if (!target) return;
                const newRole = currentRole === 'admin' ? 'user' : 'admin';
                if (!confirm(`Alterar cargo de "${target.displayName || target.email}" para ${newRole.toUpperCase()}?`)) return;
                try {
                    await firebaseDb.collection('users').doc(userId).update({ role: newRole });
                    target.role = newRole;
                    await registerAdminAudit(newRole === 'admin' ? 'PROMOTE_ADMIN' : 'DEMOTE_USER', {
                        id: userId,
                        email: target.email,
                        details: `Cargo alterado de ${currentRole} para ${newRole}`
                    });
                    renderAdminUsersTable();
                    if (typeof showToast === 'function') showToast(`Cargo de ${target.displayName || target.email} atualizado para ${newRole}.`, 'success');
                } catch(e) {
                    alert('Erro ao atualizar cargo: ' + (e.message || e));
                }
            };

            window.toggleUserStatus = async function(userId, currentStatus) {
                const target = allUsersList.find(u => u.id === userId);
                if (!target) return;
                const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
                if (!confirm(`${newStatus === 'blocked' ? 'Bloquear acesso de' : 'Reativar conta de'} "${target.displayName || target.email}"?`)) return;
                try {
                    await firebaseDb.collection('users').doc(userId).update({ status: newStatus });
                    target.status = newStatus;
                    await registerAdminAudit(newStatus === 'blocked' ? 'BLOCK_USER' : 'UNBLOCK_USER', {
                        id: userId,
                        email: target.email,
                        details: `Status alterado para ${newStatus}`
                    });
                    renderAdminUsersTable();
                    if (typeof showToast === 'function') showToast(`Conta de ${target.displayName || target.email} foi ${newStatus === 'blocked' ? 'bloqueada' : 'ativada'}.`, 'warning');
                } catch(e) {
                    alert('Erro ao atualizar status: ' + (e.message || e));
                }
            };

            overlay.querySelector('#admSearchUserInput').oninput = renderAdminUsersTable;
            overlay.querySelector('#admBtnRefresh').onclick = loadAdminUsers;
            overlay.querySelector('#admBtnFirestoreRules').onclick = openFirestoreRulesModal;

            overlay.querySelector('#admBtnPushDefaults').onclick = async () => {
                if (!confirm('Deseja salvar a lista atual de scripts como o modelo padrão global da empresa no Firestore? Novos atendentes que conectarem receberão esta base.')) return;
                try {
                    const appData = getAppData();
                    const payload = {
                        scripts: appData,
                        tabOrder: getSavedTabOrder(appData),
                        customDefaults: getCustomDefaults(),
                        settings: {
                            theme: localStorage.getItem(THEME_KEY) || 'dark',
                            layout: localStorage.getItem(LAYOUT_KEY) || 'grid',
                            scale: parseFloat(localStorage.getItem(SCALE_KEY)) || 1
                        },
                        updatedBy: currentUser.email,
                        updatedAt: new Date().toISOString()
                    };
                    // Salva em templates/default_scripts e global_settings/default_scripts para compatibilidade total
                    await Promise.all([
                        firebaseDb.collection('templates').doc('default_scripts').set(payload, { merge: true }),
                        firebaseDb.collection('global_settings').doc('default_scripts').set(payload, { merge: true })
                    ]);
                    if (typeof showToast === 'function') {
                        showToast('Scripts padrão corporativos atualizados na nuvem com sucesso!', 'success');
                    } else {
                        alert('Scripts padrão corporativos atualizados na nuvem com sucesso!');
                    }
                } catch(e) {
                    alert('Erro ao salvar scripts corporativos: ' + (e.message || e));
                }
            };

            loadAdminUsers();
            document.body.appendChild(overlay);
        }


        
        // ===== EXPOSIÇÃO GLOBAL DOS HANDLERS (GARANTIA DE FUNCIONAMENTO DE TODOS OS BOTÕES) =====
        window.openTicketFormModal = openTicketFormModal;
        window.openTestFormModal = openTestFormModal;

        window.addNewClientAlarm = addNewClientAlarm;

        window.toggleAppendChip = toggleAppendChip;
        window.toggleHorarioChip = toggleHorarioChip;
        if (typeof setFieldVal !== 'undefined') window.setFieldVal = setFieldVal;
        if (typeof handleTicketSelectChange !== 'undefined') window.handleTicketSelectChange = handleTicketSelectChange;
        if (typeof toggleSideTestView !== 'undefined') window.toggleSideTestView = toggleSideTestView;

        window.saveScratchpad = saveScratchpad;
        window.showAlarmPopup = showAlarmPopup;
        window.initAudioUnlock = initAudioUnlock;

                /* Acessibilidade para Modais: Fechamento com Esc e foco automático */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const openOverlays = document.querySelectorAll('.var-modal-overlay, .update-overlay, .usm-overlay');
                if (openOverlays.length > 0) {
                    const topOverlay = openOverlays[openOverlays.length - 1];
                    topOverlay.remove();
                }
            }
        });

        function initMainApp() {
            if (window.__appInitialized) return;
            window.__appInitialized = true;
            try {
                const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
                try { initFirebaseApp(); } catch (fbErr) { console.warn('Firebase init offline:', fbErr); }
                updateStorageIndicator();
                updateUndoButton();
                const themeSel = document.getElementById('themeSelect');
                if (themeSel) themeSel.value = savedTheme;
                changeTheme(savedTheme);
                migrateV2();
                ensureVarSeed();
                renderCommandBar();
                loadAppData();
                applyCardScale(parseFloat(localStorage.getItem(SCALE_KEY)) || 1);
                setLayout(localStorage.getItem(LAYOUT_KEY) || 'grid');
                updateCompanionButton();
                initAlarmConfigUI();
                requestNotificationPermission();
                const initScratchTa = document.getElementById('scratchpadText');
                if (initScratchTa) {
                    initScratchTa.value = localStorage.getItem(SCRATCHPAD_KEY) || '';
                }

                // Executa userscripts salvos somente após a interface estar pronta.
                setTimeout(() => {
                    try { runStoredUserscripts(window); } catch(e) {}
                }, 0);
                scheduleUpdateCheck();

                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') { searchInput.value = ''; filterScripts(''); searchInput.blur(); }
                    });
                }
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'K' || e.key === 'k')) {
                        e.preventDefault();
                        if (searchInput) { searchInput.focus(); searchInput.select(); }
                    }
                    if (e.altKey && e.shiftKey && (e.key === 'P' || e.key === 'p')) {
                        e.preventDefault();
                        toggleCompanion();
                    }
                });
                window.addEventListener('storage', (e) => {
                    if (e.key === STORAGE_KEY) scheduleCompanionRefresh();
                });
                window.addEventListener('beforeunload', saveAppData);
            } catch (err) {
                console.error('Erro na inicialização da Central de Scripts:', err);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMainApp);
        } else {
            initMainApp();
        }
        window.addEventListener('load', initMainApp);

    </script>
